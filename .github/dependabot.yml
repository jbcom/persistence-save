version: 2
updates:
  # One entry for the whole pnpm workspace. The lockfile lives at the root, so
  # Dependabot must run there to cover the docs workspace member and keep
  # pnpm-lock.yaml in step with docs/package.json. A separate /docs entry bumps
  # docs/package.json alone and leaves the root lockfile stale.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        applies-to: version-updates
        update-types: [major]
      non-major:
        applies-to: version-updates
        update-types: [minor, patch]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        applies-to: version-updates
        update-types: [major]
      non-major:
        applies-to: version-updates
        update-types: [minor, patch]
    labels:
      - dependencies
      - ci
