version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        applies-to: version-updates
        update-types: [major]
      non-major:
        applies-to: version-updates
        update-types: [minor, patch]
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      major:
        applies-to: version-updates
        update-types: [major]
      non-major:
        applies-to: version-updates
        update-types: [minor, patch]
    labels:
      - dependencies
      - docs

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        applies-to: version-updates
        update-types: [major]
      non-major:
        applies-to: version-updates
        update-types: [minor, patch]
    labels:
      - dependencies
      - ci
