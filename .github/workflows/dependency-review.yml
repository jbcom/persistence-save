name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Dependency Review / gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || format('refs/heads/{0}', github.event.repository.default_branch) }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
