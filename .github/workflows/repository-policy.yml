name: Repository Policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Repository Policy / gate
    runs-on: ubuntu-24.04
    steps:
      - name: Keep external forks out of the trusted control plane
        env:
          GH_TOKEN: ${{ github.token }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            PR_NUMBER="$(gh pr list --repo "$REPOSITORY" --head "$HEAD_REF" --state open --json number --jq '.[0].number')"
            test -n "$PR_NUMBER"
            IS_FORK="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json isCrossRepository --jq '.isCrossRepository')"
          fi
          if [ "$IS_FORK" != true ]; then exit 0; fi
          changed_files="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"
          forbidden='^(.github/workflows/|.github/actions/|.github/dependabot.yml$|.coderabbit.yaml$|sonar-project.properties$|release-please-config.json$|.release-please-manifest.json$|docs/sourcey.config.ts$|docs/package.json$)'
          if printf '%s\n' "$changed_files" | grep -E "$forbidden"; then
            echo "External forks cannot modify trusted automation or documentation deployment controls." >&2
            exit 1
          fi
